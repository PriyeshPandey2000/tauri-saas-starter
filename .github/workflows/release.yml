name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_NAME: Tauri SaaS Starter

jobs:
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag is on main and matches the package version
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi
          pkg_version=$(node -p "require('./apps/desktop/package.json').version")
          expected="v${pkg_version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match package version ('$expected')" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME verified on origin/main at $GITHUB_SHA"
      - name: Require green CI for the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # CI may still be running for the commit main just received; wait up to 30 min.
          for i in $(seq 1 60); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&workflow=ci.yml&per_page=1" --jq '.workflow_runs[0] // empty')
            status=$(jq -r '.status // "missing"' <<<"$run")
            if [ "$status" = "completed" ]; then
              conclusion=$(jq -r '.conclusion' <<<"$run")
              if [ "$conclusion" = "success" ]; then
                echo "CI concluded success for $GITHUB_SHA"
                exit 0
              fi
              echo "CI concluded '$conclusion' for $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Waiting for CI on $GITHUB_SHA (attempt $i/60, status: $status)"
            sleep 30
          done
          echo "Timed out waiting for CI on $GITHUB_SHA" >&2
          exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - name: Version check
        run: pnpm run version:check
      - name: Release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          delim="release_notes_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            node scripts/changelog.mjs
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
      - name: Build, sign (when secrets exist) and draft release (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_ENV: prod
          VITE_UPDATER_ENDPOINT: ${{ vars.VITE_UPDATER_ENDPOINT }}
          VITE_UPDATER_ENDPOINT_BETA: ${{ vars.VITE_UPDATER_ENDPOINT_BETA }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ env.PRODUCT_NAME }} ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          tauriScript: pnpm --filter desktop tauri
          args: ${{ matrix.args }}
      - name: Build, sign (when secrets exist) and draft release (Windows)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_ENV: prod
          VITE_UPDATER_ENDPOINT: ${{ vars.VITE_UPDATER_ENDPOINT }}
          VITE_UPDATER_ENDPOINT_BETA: ${{ vars.VITE_UPDATER_ENDPOINT_BETA }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ env.PRODUCT_NAME }} ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          tauriScript: pnpm --filter desktop tauri
          args: ${{ matrix.args }}
      - name: Verify shipped assets
        shell: bash
        run: |
          pnpm --filter desktop verify:bundle-secrets
          node scripts/check-no-dev-bridge.mjs
