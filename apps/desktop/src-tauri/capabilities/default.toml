# TOML is used here (not JSON) so this capability can carry comments.
# `core:window:allow-set-theme` is not part of `core:window:default`. It lets the
# app set the native window (title bar) theme to match the in-app theme.
"$schema" = "../gen/schemas/desktop-schema.json"
identifier = "default"
description = "Capability for the main window"
windows = ["main"]
permissions = [
  "core:default",
  "store:default",
  "window-state:default",
  "core:window:allow-set-theme",
  # Frontend writes through the LoggerPort file adapter; reads/level control stay denied.
  "log:allow-log",
]
