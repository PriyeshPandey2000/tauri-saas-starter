# TOML is used here (not JSON) so this capability can carry comments.
# `keyring` is a crate used by app commands, not a Tauri plugin, so the
# `secure_*` commands need no capability entry.
"$schema" = "../gen/schemas/desktop-schema.json"
identifier = "default"
description = "Capability for the main window"
windows = ["main"]
permissions = [
  # Core window/webview commands used by the app shell.
  "core:default",
  # Settings persistence through plugin-store (settings.json).
  "store:default",
  # Restore window size and position across launches.
  "window-state:default",
  # Set the native title bar theme; not part of core:window:default.
  "core:window:allow-set-theme",
  # Frontend writes through the LoggerPort file adapter; reads stay denied.
  "log:allow-log",
]
