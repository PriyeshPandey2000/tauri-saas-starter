# TOML is used here (not JSON) so this capability can carry comments.
# `keyring` is a crate used by app commands, not a Tauri plugin, so the
# `secure_*` commands need no capability entry.
"$schema" = "../gen/schemas/desktop-schema.json"
identifier = "default"
description = "Capability for the main window"
windows = ["main"]
permissions = [
  # Core window/webview commands used by the app shell.
  "core:default",
  # Settings persistence through plugin-store (settings.json).
  "store:default",
  # Restore window size and position across launches.
  "window-state:default",
  # Set the native title bar theme; not part of core:window:default.
  "core:window:allow-set-theme",
  # Frontend writes through the LoggerPort file adapter; reads stay denied.
  "log:allow-log",
  # Open the system browser for OAuth (https only via the default URL scope).
  "opener:default",
  # Receive the OAuth callback on tauri-saas-starter://auth/callback.
  "deep-link:default",
  # Local SQLite (per-user file). Load/open and the query/execute calls the
  # DatabasePort needs; the migration runner and repositories use these.
  "sql:default",
  "sql:allow-load",
  "sql:allow-execute",
  "sql:allow-select",
  "sql:allow-close",
  # User-configurable global shortcut (register/unregister only).
  "global-shortcut:default",
  # Notifications after an explicit permission request.
  "notification:default",
  # Launch-at-login toggle (off by default).
  "autostart:default",
  # Signed auto-updates: check/download/install through the plugin.
  "updater:default",
  # Relaunch after an installed update.
  "process:default",
]
